name: Autonomous Claude Developer
run-name: Autonomous Claude Developer

# Started by the Cloudflare relay (linear-relay/) calling POST /repos/{owner}/{repo}/dispatches with:
#   { "event_type": "linear_dev_task",
#     "client_payload": { "issue_id": "KAN-12", "title": "...", "description": "..." } }
on:
  repository_dispatch:
    types: [linear_dev_task]  # Custom webhook event name

# One run per Linear issue at a time
concurrency:
  group: linear-${{ github.event.client_payload.issue_id }}
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write   # to start the review agent

    steps:
      # Step 1: Check out the project code.
      # Credentials are not left in .git/config, so Claude (step 3) can't push with them.
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Step 2: Set up Node.js & Install Claude Code CLI
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Step 3: Run Claude Code with Linear details from the webhook.
      # No GitHub token in this step: the prompt comes from issue text.
      - name: Run Claude Code Agent
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TASK_TITLE: ${{ github.event.client_payload.title }}
          TASK_DESC: ${{ github.event.client_payload.description }}
          ISSUE_ID: ${{ github.event.client_payload.issue_id }}
        run: |
          set -euo pipefail

          # Sanitize the issue id so it is always a valid branch name
          SAFE_ID=$(printf '%s' "$ISSUE_ID" | tr -c 'A-Za-z0-9._-' '-')
          BRANCH_NAME="claude/linear-${SAFE_ID}"
          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH_NAME"

          # Prompt Claude to execute the task
          PROMPT=$(cat <<EOF
          You are an autonomous developer. Work on the following specs from Linear ticket $ISSUE_ID:
          Title: $TASK_TITLE
          Description: $TASK_DESC

          Requirements:
          1. Implement the requested feature or project updates.
          2. Ensure all tests pass.
          3. Do not alter unneeded files.
          4. Do not run git commit, git push or create pull requests; the workflow does that.
          5. Do not modify anything under .github/; such changes are discarded.
          EOF
          )

          claude -p "$PROMPT" \
            --permission-mode acceptEdits \
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash" \
            --max-turns 40

      # Step 4: Commit, push, and open a Pull Request
      - name: Open Pull Request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TASK_TITLE: ${{ github.event.client_payload.title }}
          ISSUE_ID: ${{ github.event.client_payload.issue_id }}
          BRANCH_NAME: ${{ steps.agent.outputs.branch }}
        run: |
          set -euo pipefail

          # GITHUB_TOKEN can't push workflow changes, and an issue shouldn't rewrite
          # its own automation: drop anything Claude changed under .github/.
          if [ -n "$(git status --porcelain -- .github)" ]; then
            echo "::warning::Discarded Claude's changes under .github/:"
            git status --porcelain -- .github
            git checkout HEAD -- .github
            git clean -fdq -- .github
          fi

          # Nothing changed? Then there is nothing to push.
          if [ -z "$(git status --porcelain)" ]; then
            echo "Claude made no changes for $ISSUE_ID; skipping PR."
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "Claude Agent Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

          git add -A
          git commit -m "feat($ISSUE_ID): $TASK_TITLE"
          # Force: a re-triggered issue replaces the previous attempt on its branch
          git push --force origin "$BRANCH_NAME"

          # Reuse the open PR if this issue already has one
          PR_URL=$(gh pr list --head "$BRANCH_NAME" --state open --json url --jq '.[0].url')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --title "Fix/Feature ($ISSUE_ID): $TASK_TITLE" \
              --body "Automated PR generated by Claude Code for Linear Issue $ISSUE_ID." \
              --head "$BRANCH_NAME" \
              --base "$DEFAULT_BRANCH")
          fi

          echo "Opened $PR_URL"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

          # Hand the PR to the review agent (PRs opened with GITHUB_TOKEN don't trigger workflows)
          gh workflow run claude-review.yml --ref "$DEFAULT_BRANCH" -f pr_number="${PR_URL##*/}" \
            || echo "::warning::Could not start the review agent."

      # Step 5: Report back to Linear (comment with PR link + move issue status)
      - name: Update Linear Issue
        if: steps.pr.outputs.pr_url != ''
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_STATE_NAME: ${{ vars.LINEAR_STATE_NAME || 'In Review' }}
          ISSUE_ID: ${{ github.event.client_payload.issue_id }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          set -euo pipefail

          linear() {
            # $1 = GraphQL document, $2 = JSON variables
            local resp
            resp=$(curl -sS https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d "$(jq -n --arg q "$1" --argjson v "$2" '{query: $q, variables: $v}')")
            if [ "$(printf '%s' "$resp" | jq 'has("errors")')" = "true" ]; then
              echo "Linear API error: $(printf '%s' "$resp" | jq -c '.errors')" >&2
              return 1
            fi
            printf '%s' "$resp"
          }

          # Look up the issue's internal id and its team's workflow states
          ISSUE=$(linear 'query($id: String!) {
            issue(id: $id) { id team { states { nodes { id name } } } }
          }' "$(jq -n --arg id "$ISSUE_ID" '{id: $id}')")

          ISSUE_UUID=$(printf '%s' "$ISSUE" | jq -r '.data.issue.id')
          STATE_ID=$(printf '%s' "$ISSUE" | jq -r --arg n "$LINEAR_STATE_NAME" \
            '.data.issue.team.states.nodes[] | select(.name == $n) | .id' | head -n1)

          # 1) Comment with the PR link
          linear 'mutation($input: CommentCreateInput!) {
            commentCreate(input: $input) { success }
          }' "$(jq -n --arg id "$ISSUE_UUID" --arg url "$PR_URL" \
            '{input: {issueId: $id, body: ("Claude opened a pull request for this issue: " + $url)}}')" > /dev/null
          echo "Commented on $ISSUE_ID"

          # 2) Move the issue to the configured status
          if [ -z "$STATE_ID" ]; then
            echo "::warning::No Linear status named '$LINEAR_STATE_NAME' on this team; status not changed."
            exit 0
          fi

          linear 'mutation($id: String!, $input: IssueUpdateInput!) {
            issueUpdate(id: $id, input: $input) { success }
          }' "$(jq -n --arg id "$ISSUE_UUID" --arg s "$STATE_ID" \
            '{id: $id, input: {stateId: $s}}')" > /dev/null
          echo "Moved $ISSUE_ID to '$LINEAR_STATE_NAME'"
